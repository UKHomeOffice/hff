# Production environment values
global:
  namespace: hff-prod
  environment: prod

app:
  replicas: 2

image:
  tag: "v1.0.0"  # Specify exact version for prod

ingress:
  external:
    hosts:
      prod: "hff-cc.homeoffice.gov.uk"  # Set your production domain
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

configMap:
  data:
    NODE_ENV: production
    LOG_LEVEL: info

healthChecks:
  enabled: true
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 20
    periodSeconds: 10

downscaler:
  uptime: ""  # No downscaling for production
