# HFF App Helm Chart - Complete Configuration Reference
# This file shows all available configuration options with descriptions

# Global cluster settings
global:
  namespace: hff-dev                    # Kubernetes namespace for deployment
  environment: dev                      # Environment: prod, uat, dev, branch

# Application settings
app:
  name: hff-cc                         # Application name
  replicas: 1                          # Pod replicas (auto 2 in prod)

# Container image configuration
image:
  repository: quay.io/ukhomeofficedigital/hff-cc  # Image repository
  tag: "latest"                        # Image tag/version (use commit SHA in CI/CD)
  pullPolicy: Always                   # Always, IfNotPresent, Never

# Container port mappings
containerPorts:
  app: 8080                            # Application port
  nginx: 10443                         # Nginx HTTPS port

# Kubernetes Service configuration
service:
  type: ClusterIP                      # Service type: ClusterIP, NodePort, LoadBalancer
  ports:
    http: 10080                        # HTTP port (mapped to app port 8080)
    https: 10443                       # HTTPS port (mapped to nginx port 10443)

# Ingress configuration
ingress:
  enabled: true                        # Enable/disable ingress
  externalEnabled: true                # Enable external ingress
  internalEnabled: true                # Enable internal ingress
  className: nginx-external            # Ingress class name
  external:
    hosts:
      prod: ""                         # Production hostname
      uat: "hff-cc.uat.sas-notprod.homeoffice.gov.uk"
      dev: "hff-cc.sas-notprod.homeoffice.gov.uk"
      branch: ""                       # Auto-set for branch: {app}-{branch}.branch.sas-notprod.homeoffice.gov.uk
    tls:
      certName: cert-cmio              # Default certificate name
      branchCertName: branch-tls-external  # Branch certificate name
    annotations: {}                    # Ingress annotations
      # Examples:
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # nginx.ingress.kubernetes.io/rate-limit: "100"
  internal:
    hosts:
      uat: "hff-cc.internal.uat.sas-notprod.homeoffice.gov.uk"
      branch: ""                       # Auto-set for branch
    tls:
      certName: ingress-internal       # Internal certificate name
      branchCertName: branch-tls-internal
    annotations: {}                    # Internal ingress annotations

# Application environment variables
env:
  TZ: Europe/London                    # Timezone
  NODE_TLS_REJECT_UNAUTHORIZED: "0"   # Node TLS settings
  REDIS_PORT: "6379"                  # Redis port
  USE_MOCKS: "false"                  # Use mock data

# Resource allocation (requests and limits)
resources:
  app:
    requests:
      cpu: "20m"
      memory: "100Mi"
    limits:
      cpu: "100m"
      memory: "200Mi"
  nginx:
    requests:
      memory: "10Mi"
      cpu: "10m"
    limits:
      cpu: "250m"
      memory: "256Mi"

# Nginx proxy sidecar configuration
nginx:
  image: quay.io/ukhomeofficedigital/nginx-proxy-govuk@sha256:4470064d0b1d20ae08c5fd85551576cb687f342a22d6cb456fda9b2c4ce8c8df
  settings: |
    server_name _;
    listen 10443 ssl http2;
    absolute_redirect off;
    server_tokens off;

# Application health checks
healthChecks:
  enabled: true                        # Enable health checks (auto-disabled for branch)
  liveness:
    enabled: true
    initialDelaySeconds: 10            # Wait before first check
    periodSeconds: 10                  # Check interval
    path: /healthz/ping                # Health check endpoint
  readiness:
    enabled: true
    initialDelaySeconds: 15            # Wait before first check
    periodSeconds: 5                   # Check interval
    path: /healthz/readiness           # Readiness check endpoint

# Application ConfigMap
configMap:
  enabled: true                        # Enable ConfigMap
  data: {}                             # Key-value configuration data
    # Example:
    # SOME_SETTING: "value"
    # ANOTHER_SETTING: "another-value"

# Kubernetes Secrets (must exist in namespace)
secrets:
  sessionSecret:
    name: session-secret               # Secret name
    key: session-secret                # Secret key
  notifyKey:
    name: notify-key
    key: notify-key
  queryKey:
    name: query-key
    key: query-key

# Redis cache configuration
redis:
  enabled: true                        # Enable Redis
  name: redis                          # Redis instance name
  image: quay.io/ukhomeofficedigital/hof-docker-redis:7.0.15@sha256:cd4965fbb8aa6e4eba058985cc52f6a3ececdfa6d79ba44206f051f72a1f0611
  port: 6379                           # Redis port
  replicas: 1                          # Redis pod replicas
  resources:
    requests:
      cpu: "20m"
      memory: "100Mi"
    limits:
      cpu: "100m"
      memory: "200Mi"

# Network policies for pod security
networkPolicies:
  enabled: true                        # Enable network policies
  externalIngress: true                # Allow external ingress traffic
  internalIngress: true                # Allow internal ingress traffic
  redisAccess: true                    # Allow Redis access from app

# Certificate management (cert-manager)
certificates:
  enabled: true                        # Enable automatic certificates
  branch:
    external:
      enabled: true                    # Enable external branch certificate
      commonName: "*.branch.sas-notprod.homeoffice.gov.uk"
      issuer: letsencrypt-prod         # Issuer reference
    internal:
      enabled: true                    # Enable internal branch certificate
      commonName: "*.internal.branch.sas-notprod.homeoffice.gov.uk"
      issuer: letsencrypt-prod

# Pod security context
securityContext:
  runAsNonRoot: true                   # Run containers as non-root user

# Downscaler configuration for non-prod environments
downscaler:
  uptime: "Mon-Fri 08:00-18:00 UTC"  # Uptime schedule (empty = always on)

# Branch-specific deployment configuration
branch:
  enabled: false                       # Enable branch deployment
  name: ""                             # Branch identifier (feature-xyz)
  sourceUrl: ""                        # Git branch name

# Notes:
# 1. For production, set global.environment to "prod"
# 2. For UAT, set global.environment to "uat"
# 3. Health checks are automatically disabled for branch deployments
# 4. Replicas are automatically set to 2 for production
# 5. Create required secrets before deployment:
#    - kubectl create secret generic session-secret --from-literal=session-secret=VALUE
#    - kubectl create secret generic notify-key --from-literal=notify-key=VALUE
#    - kubectl create secret generic query-key --from-literal=query-key=VALUE
# 6. For branch deployments, specify branch name and source URL at install time
# 7. Configure ingress hostnames and certificates for your environment
