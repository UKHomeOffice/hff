# Local Kubernetes cluster values
# Use with: helm install hff-app ./helm-app -n hff-local --create-namespace -f helm-app/values-local.yaml

global:
  namespace: hff-local
  environment: dev

app:
  replicas: 1

image:
  # For local development with mock server
  # Uses Node.js alpine image instead of the actual hff-cc image
  repository: node
  tag: 18-alpine
  pullPolicy: IfNotPresent  # Allow pulling from registry

# Override security context for local (nginx runs as root)
securityContext:
  runAsNonRoot: false

# Override container command for local mock server
command:
  - node
  - -e
  - |
    const http = require('http');
    const server = http.createServer((req, res) => {
      if (req.url === '/healthz/ping' || req.url === '/healthz/readiness') {
        res.writeHead(200, {'Content-Type': 'application/json'});
        res.end(JSON.stringify({status: 'ok'}));
      } else {
        res.writeHead(200, {'Content-Type': 'text/plain'});
        res.end('Mock HFF Server - Local Development\n');
      }
    });
    server.listen(8080, '0.0.0.0', () => console.log('Mock server listening on port 8080'));
    process.on('SIGTERM', () => { server.close(); process.exit(0); });

ingress:
  enabled: true
  externalEnabled: true
  internalEnabled: false  # Disable internal ingress for local setup
  external:
    hosts:
      dev: "hff-cc.local"  # Configure in /etc/hosts: 127.0.0.1 hff-cc.local
    annotations:
      cert-manager.io/cluster-issuer: "selfsigned-issuer"  # Use self-signed for local
  internal:
    hosts:
      dev: ""

# Reduce resource requirements for local development
resources:
  app:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "50m"
      memory: "128Mi"
  nginx:
    requests:
      cpu: "5m"
      memory: "10Mi"
    limits:
      cpu: "50m"
      memory: "64Mi"

# Simplified nginx settings for local
nginx:
  image: nginx:latest
  settings: |
    server_name _;
    listen 10443 ssl http2;
    absolute_redirect off;
    server_tokens off;

# Health checks with longer delays for local (slower machines)
healthChecks:
  enabled: true
  liveness:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 30
    path: /healthz/ping
  readiness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    path: /healthz/readiness

configMap:
  enabled: true
  data:
    NODE_ENV: local
    LOG_LEVEL: debug
    USE_MOCKS: "false"

# Reduced Redis resources for local
redis:
  enabled: true
  name: redis
  image: redis:7-alpine
  port: 6379
  replicas: 1
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "50m"
      memory: "64Mi"

# Network policies - can be disabled for local testing
networkPolicies:
  enabled: false  # Disable for easier local testing

# Certificates - use self-signed for local
certificates:
  enabled: false  # Disable for local, use IfNotPresent instead

# No downscaler for local development
downscaler:
  uptime: ""

# Disable branch-specific features for local
branch:
  enabled: false
  name: ""
  sourceUrl: ""

nginxProxy:
  enabled: false
