---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hff-app
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if eq .Values.global.environment "prod" }}
  replicas: 2
  {{- else }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hff-app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        name: {{ .Values.app.name }}
        app.kubernetes.io/name: hff-app
        app.kubernetes.io/instance: {{ .Release.Name }}
        app: {{ .Values.app.name }}
        service: {{ .Values.app.name }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: {{ .Values.app.name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.command }}
        command:
          {{- toYaml .Values.command | nindent 10 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - containerPort: {{ .Values.containerPorts.app }}
          name: app
        envFrom:
        - configMapRef:
            name: {{ .Values.app.name }}-configmap
        env:
        - name: TZ
          value: {{ .Values.env.TZ }}
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: {{ .Values.env.NODE_TLS_REJECT_UNAUTHORIZED | quote }}
        - name: REDIS_PORT
          value: {{ .Values.env.REDIS_PORT | quote }}
        - name: REDIS_HOST
          value: {{ .Values.redis.name }}
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.sessionSecret.name }}
              key: {{ .Values.secrets.sessionSecret.key }}
        - name: NOTIFY_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.notifyKey.name }}
              key: {{ .Values.secrets.notifyKey.key }}
        - name: QUERY_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.queryKey.name }}
              key: {{ .Values.secrets.queryKey.key }}
        - name: USE_MOCKS
          value: {{ .Values.env.USE_MOCKS | quote }}
        {{- if .Values.healthChecks.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.healthChecks.liveness.path }}
            port: {{ .Values.containerPorts.app }}
          initialDelaySeconds: {{ .Values.healthChecks.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthChecks.liveness.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthChecks.readiness.path }}
            port: {{ .Values.containerPorts.app }}
          initialDelaySeconds: {{ .Values.healthChecks.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthChecks.readiness.periodSeconds }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources.app | nindent 10 }}
        volumeMounts:
        - mountPath: /public
          name: public

      {{- if or (not .Values.nginxProxy) (.Values.nginxProxy.enabled) }}
      - name: nginx-proxy
        image: {{ .Values.nginx.image }}
        resources:
          {{- toYaml .Values.resources.nginx | nindent 10 }}
        ports:
        - containerPort: {{ .Values.containerPorts.nginx }}
          name: https
        volumeMounts:
        - mountPath: /public
          name: public
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      {{- end }}
      volumes:
      - name: public
        emptyDir: {}
