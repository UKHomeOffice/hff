{{- if .Values.certificates.enabled }}
{{- if .Values.certificates.branch.external.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.external.tls.branchCertName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hff-app
    app.kubernetes.io/instance: {{ .Release.Name }}
    cert-manager.io/solver: http01
spec:
  commonName: {{ .Values.certificates.branch.external.commonName }}
  dnsNames:
    - {{ .Values.certificates.branch.external.commonName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.certificates.branch.external.issuer }}
  secretName: {{ .Values.ingress.external.tls.branchCertName }}
{{- end }}
{{- end }}
