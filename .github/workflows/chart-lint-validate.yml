name: Lint and validate Helm chart

on:
    workflow_call:
        inputs:
            chart_directory:
                description: Path to the Helm chart directory
                required: false
                type: string
                default: charts/hff
            helm_version:
                description: Helm version to install
                required: false
                type: string
                default: v3.16.3
            run_unittest:
                description: Run helm unit tests
                required: false
                type: boolean
                default: true
    pull_request:
        branches:
            - master
        paths:
            - "charts/hff/**"
            - ".github/workflows/chart-lint-validate.yml"
    push:
        branches:
            - CCL-*
            - master
        paths:
            - "charts/hff/**"
            - ".github/workflows/chart-lint-validate.yml"
    workflow_dispatch:
        inputs:
            chart_directory:
                description: Path to the Helm chart directory
                required: false
                type: string
                default: charts/hff
            helm_version:
                description: Helm version to install
                required: false
                type: string
                default: v3.16.3
            run_unittest:
                description: Run helm unit tests
                required: false
                type: boolean
                default: true

jobs:
    chart-validation:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Helm
              uses: Home-Office-Digital/core-cloud-workflow-helm-ecr-actions/actions/setup@feature/helm-publish-ecr-action
              with:
                  helm_version: ${{ inputs.helm_version || 'v3.16.3' }}
                  install_unittest: ${{ inputs.run_unittest != '' && inputs.run_unittest || true }}

            - name: Lint chart
              uses: Home-Office-Digital/core-cloud-workflow-helm-ecr-actions/actions/lint@feature/helm-publish-ecr-action
              with:
                  chart_directory: ${{ inputs.chart_directory || 'charts/hff' }}

            - name: Validate chart rendering
              uses: Home-Office-Digital/core-cloud-workflow-helm-ecr-actions/actions/validate@feature/helm-publish-ecr-action
              with:
                  chart_directory: ${{ inputs.chart_directory || 'charts/hff' }}
                  run_unittest: ${{ inputs.run_unittest != '' && inputs.run_unittest || true }}
