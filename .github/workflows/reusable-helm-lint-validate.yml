name: Reusable Helm chart lint and validate

on:
    workflow_call:
        inputs:
            chart_path:
                description: Path to the Helm chart directory
                required: true
                type: string
            release_name:
                description: Release name used for helm template rendering
                required: false
                type: string
                default: chart-release
            set_values:
                description: Newline-delimited values for --set (key=value)
                required: false
                type: string
                default: ""
            working_directory:
                description: Repository subdirectory containing the chart path
                required: false
                type: string
                default: "."
    workflow_dispatch:
        inputs:
            chart_path:
                description: Path to the Helm chart directory
                required: true
                type: string
            release_name:
                description: Release name used for helm template rendering
                required: false
                type: string
                default: chart-release
            set_values:
                description: Newline-delimited values for --set (key=value)
                required: false
                type: string
                default: ""
            working_directory:
                description: Repository subdirectory containing the chart path
                required: false
                type: string
                default: "."

jobs:
    chart-validation:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ inputs.working_directory }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v4

            - name: Lint and validate chart rendering
              run: |
                  set -euo pipefail
                  chart_path='${{ inputs.chart_path }}'
                  release_name='${{ inputs.release_name }}'
                  set_values='${{ inputs.set_values }}'

                  args=()
                  while IFS= read -r value; do
                    if [ -n "$value" ]; then
                      args+=(--set "$value")
                    fi
                  done <<< "$set_values"

                  helm lint "$chart_path" "${args[@]}"
                  helm template "$release_name" "$chart_path" "${args[@]}" > /dev/null
