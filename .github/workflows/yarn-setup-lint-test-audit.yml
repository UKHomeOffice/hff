name: Yarn CI - Setup, Lint, Unit Tests, Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - CCL-*

jobs:
  yarn_setup_lint_unit_tests_audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node yarn setup
        uses: Home-Office-Digital/core-cloud-workflow-node-yarn-actions/actions/setup@1.3.1
        with:
          working_directory: .
          node_version: "24.19.0"

      - name: Yarn Linting
        id: lint
        uses: Home-Office-Digital/core-cloud-workflow-node-yarn-actions/actions/lint@1.3.1
        with:
          working_directory: .

      - name: Fail if lint failed
        if: steps.lint.outputs.yarn_lint_exit_code != '0'
        run: exit 1

      - name: Yarn Audit
        id: yarn_audit_high_and_critical
        uses: Home-Office-Digital/core-cloud-workflow-node-yarn-actions/actions/audit@1.3.1
        with:
          working_directory: .
          audit_level: high
          
      - name: Unit Tests
        id: unit_test
        uses: Home-Office-Digital/core-cloud-workflow-node-yarn-actions/actions/test@1.3.1
        with:
          working_directory: .
          
      - name: Fail if tests failed
        if: steps.unit_test.outputs.yarn_test_exit_code != '0'
        run: exit 1