    #         ROLE_TO_ASSUME: ${{ secrets.HOFPROD_ROLE_TO_ASSUME }}
    #         EXEMPTIONS_APP_ID: ${{ secrets.EXEMPTIONS_APP_ID }}
    #         EXEMPTIONS_APP_PRIVATE_KEY: ${{ secrets.EXEMPTIONS_APP_PRIVATE_KEY }}

    build-scan-hofnotprod-pattern-test:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/CCL-')
        permissions:
            contents: read
            id-token: write
        uses: Home-Office-Digital/core-cloud-workflow-docker-actions/.github/workflows/build-scan-push.yml@1.5.0
        with:
            working_directory: "."
            dockerfile: ".github/docker/Dockerfile.pattern-test"
            image_name: "hff/hff-pattern-test"
            image_tag: "${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.sha }}"
            tag_latest: false
        secrets:
            AWS_ECR_ACCOUNT_ID: ${{ secrets.HOFNOTPROD_AWS_ECR_ACCOUNT_ID }}
            ROLE_TO_ASSUME: ${{ secrets.HOFNOTPROD_ROLE_TO_ASSUME }}
            EXEMPTIONS_APP_ID: ${{ secrets.EXEMPTIONS_APP_ID }}
            EXEMPTIONS_APP_PRIVATE_KEY: ${{ secrets.EXEMPTIONS_APP_PRIVATE_KEY }}

    build-scan-hofprod-pattern-test:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/CCL-')
        needs: build-scan-hofnotprod-pattern-test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            AWS_REGION: eu-west-2
            ECR_REPOSITORY: hff/hff-pattern-test
            SOURCE_IMAGE_TAG: ${{ github.sha }}
            DESTINATION_IMAGE_TAG: ${{ github.sha }}
        steps:
            - name: Configure AWS credentials for HOFNotProd
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.HOFNOTPROD_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Read NotProd image digest and manifest
              id: source_image
              run: |
                  source_digest=$(aws ecr describe-images \
                      --repository-name "$ECR_REPOSITORY" \
                      --image-ids imageTag="$SOURCE_IMAGE_TAG" \
                      --query 'imageDetails[0].imageDigest' \
                      --output text)

                  aws ecr batch-get-image \
                      --repository-name "$ECR_REPOSITORY" \
                      --image-ids imageTag="$SOURCE_IMAGE_TAG" \
                      --accepted-media-types application/vnd.docker.distribution.manifest.v2+json application/vnd.oci.image.manifest.v1+json \
                      --query 'images[0].imageManifest' \
                      --output text > /tmp/pattern-test-manifest.json

                  echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"

            - name: Configure AWS credentials for HOFProd
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.HOFPROD_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Promote image to HOFProd ECR
              run: |
                  aws ecr put-image \
                      --repository-name "$ECR_REPOSITORY" \
                      --image-tag "$DESTINATION_IMAGE_TAG" \
                      --image-manifest file:///tmp/pattern-test-manifest.json

            - name: Verify promoted digest matches source
              run: |
                  prod_digest=$(aws ecr describe-images \
                      --repository-name "$ECR_REPOSITORY" \
                      --image-ids imageTag="$DESTINATION_IMAGE_TAG" \
                      --query 'imageDetails[0].imageDigest' \
                      --output text)

                  if [ "$prod_digest" != "${{ steps.source_image.outputs.source_digest }}" ]; then
                      echo "Promoted digest mismatch: source=${{ steps.source_image.outputs.source_digest }} prod=$prod_digest"
                      exit 1
                  fi
            