name: Building and scanning Docker images

on:
    pull_request:
        branches:
            - master
            - CCL-9787
    push:
        branches:
            - master
  
jobs:
    prepare-image-tag:
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.compute.outputs.image_tag }}
        steps:
            - name: Compute image tag
              id: compute
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BRANCH_NAME: ${{ github.head_ref }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  PUSH_SHA: ${{ github.sha }}
              run: |
                  if [ "$EVENT_NAME" = "pull_request" ]; then
                    sanitized_branch=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')
                                        short_sha=$(echo "$HEAD_SHA" | cut -c1-8)
                    echo "image_tag=${sanitized_branch}-${short_sha}" >> "$GITHUB_OUTPUT"
                  else
                    echo "image_tag=${PUSH_SHA}" >> "$GITHUB_OUTPUT"
                  fi

    build-scan:
        needs: prepare-image-tag
        permissions:
            contents: read
            id-token: write
        uses: Home-Office-Digital/core-cloud-workflow-docker-actions/.github/workflows/build-scan-push.yml@feature/CCL-8872
        with:
            working_directory: "."
            dockerfile: "Dockerfile"
            image_name: "hff/hff-app"
            image_tag: ${{ needs.prepare-image-tag.outputs.image_tag }}
            tag_latest: true
            trivy_ignorefiles: ".trivyignore"
        secrets:
            AWS_ECR_ACCOUNT_ID: ${{ secrets.AWS_ECR_ACCOUNT_ID }}
            ROLE_TO_ASSUME: ${{ secrets.ROLE_TO_ASSUME }}