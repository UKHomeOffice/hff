{{- if .Values.externalSecrets.enabled }}
{{- range $secretName, $secret := .Values.secrets }}
{{- if $secret.remoteKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $secret.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hff-app
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled=true" $.Values.externalSecrets.secretStoreRef.name }}
    kind: {{ $.Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ $secret.name }}
    creationPolicy: Owner
  data:
  - secretKey: {{ $secret.key }}
    remoteRef:
      key: {{ $secret.remoteKey }}
      {{- if $secret.remoteProperty }}
      property: {{ $secret.remoteProperty }}
      {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.envFromSecret.enabled .Values.envFromSecret.remoteKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ required "envFromSecret.name is required when envFromSecret.enabled=true" .Values.envFromSecret.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: hff-app
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled=true" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.envFromSecret.name }}
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: {{ .Values.envFromSecret.remoteKey }}
{{- end }}
{{- end }}